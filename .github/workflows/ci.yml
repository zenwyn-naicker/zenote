name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Zenote.slnx
      - run: dotnet test --solution Zenote.slnx --no-build -- --filter-not-trait "Category=RequiresOllama"
