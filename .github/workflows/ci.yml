name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build Zenote.slnx
      - run: dotnet test --solution Zenote.slnx --no-build -- --filter-not-trait "Category=RequiresOllama"
